name: Linux - Release
permissions:
  contents: read
  pull-requests: read

on:
  release:
    types:
      - created
      - edited

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment:
      name: production

    strategy:
      fail-fast: false
      matrix:
        FROM:
          - 'ubuntu:resolute'
          - 'ubuntu:noble'
          - 'linuxmintd/mint22.3-amd64'
          - 'linuxmintd/mint22.2-amd64'
          - 'linuxmintd/mint22-amd64'
          - 'debian:trixie'
          - 'debian:bookworm'
          - 'opensuse/leap:16.0'
          - 'fedora:45'
          - 'fedora:44'
          - 'fedora:43'
          - 'rockylinux/rockylinux:10.2'
          - 'rockylinux/rockylinux:9.8'
          - 'dhi.io/python:3.14-debian13-dev'
          - 'dhi.io/python:3.14-debian13-sfw-dev'
          - 'dhi.io/python:3.13-debian13-dev'
          - 'dhi.io/python:3.13-debian13-sfw-dev'
          - 'cachyos/cachyos:latest'

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        submodules: false

    - name: Extract tag name etc
      shell: bash
      run: |
        echo "TAG_NAME=$(echo ${GITHUB_REF#refs/tags/} | sed 's/\//_/g')" >> $GITHUB_ENV

    - name: Test tag name etc
      run: |
        echo "${TAG_NAME}"

    - name: Docker Login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
      with:
        username: "${{ secrets.DOCKER_HUB_USER }}"
        password: "${{ secrets.DOCKER_HUB_KEY }}"
        logout: true

    - name: Run CI
      env:
        FROM:       ${{ matrix.FROM }}
        IS_RELEASE: 1
      run: script/cibuild
